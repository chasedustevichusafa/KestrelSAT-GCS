name: Windows test build

on:
  workflow_dispatch:
  push:
    branches: ['main', 'feature/remote-files', 'feature/transfer-statistics', 'fix/file-transfer-stability', 'feature/remote-upload', 'feature/remote-file-management', 'feature/multi-operation-recordings', 'feature/remote-camera', 'docs/code-walkthrough', 'feature/transfer-speed', 'feature/live-camera-preview']
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'kestrelsat/**'
      - 'tests/**'
      - 'serial_gui.py'
      - 'requirements.txt'
      - 'KestrelSAT_GCS_v1.spec'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Run portable tests
        run: |
          python tests/test_themes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_remote_files.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_transfer_speed.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_live_preview.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_camera.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_transfer_stats.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_xbee_api.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm KestrelSAT_GCS_v1.spec
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = 'dist/KestrelSAT_GCS.exe'
          if (-not (Test-Path $exe)) { throw 'No executable produced' }
          if ((Get-Item $exe).Length -lt 5MB) { throw 'Executable is unexpectedly small' }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Missing Windows MZ header' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KestrelSAT-GCS-Windows-${{ github.sha }}
          path: |
            dist/KestrelSAT_GCS.exe
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 14
